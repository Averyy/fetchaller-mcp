services:
  fetchaller-mcp:
    image: ghcr.io/averyy/fetchaller-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fetchaller-mcp
    restart: unless-stopped
    ports:
      - "6000:6000"
    networks:
      - web
    environment:
      - HTTP_PORT=6000
      - RATE_LIMIT_REQUESTS=100
      - MCP_API_KEY=${MCP_API_KEY}
      # Must be set and STABLE across redeploys. If unset, the server generates a
      # random secret per process and every OAuth connector un-pairs on restart.
      # Generate once with: openssl rand -hex 32   (see README: JWT_SECRET)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set - generate with 'openssl rand -hex 32', see README}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-2592000}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://localhost:6000}
      - MOUSER_API_KEY=${MOUSER_API_KEY:-}
      - DIGIKEY_CLIENT_ID=${DIGIKEY_CLIENT_ID:-}
      - DIGIKEY_CLIENT_SECRET=${DIGIKEY_CLIENT_SECRET:-}
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
    volumes:
      - cookie-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cookie-data:

networks:
  web:
    external: true

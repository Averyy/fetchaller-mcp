services:
  fetchaller-mcp:
    platform: linux/amd64
    image: ghcr.io/averyy/fetchaller-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fetchaller-mcp
    restart: unless-stopped
    # HTTP shutdown gives active requests 30s to finish. An issued Enterprise
    # browser solve is bounded at 60s and may keep its owner thread alive after
    # ASGI cancellation; preserve cleanup headroom before Docker escalates.
    stop_grace_period: 75s
    ports:
      # Bind only to the host loopback interface. Terminate public TLS in a
      # host reverse proxy and forward to 127.0.0.1:6000.
      - "127.0.0.1:6000:6000"
    environment:
      - HTTP_PORT=6000
      - RATE_LIMIT_REQUESTS=100
      - MCP_API_KEY=${MCP_API_KEY:?MCP_API_KEY must be set}
      # Must be set and STABLE across redeploys. If unset, the server generates a
      # random secret per process and every OAuth connector un-pairs on restart.
      # Generate once with: openssl rand -hex 32   (see README: JWT_SECRET)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set - generate with 'openssl rand -hex 32', see README}
      - DATA_DIR=/app/data
      - BROWSER_EXECUTABLE_PATH=/opt/google/chrome/chrome
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-2592000}
      - MCP_SERVER_URL=${MCP_SERVER_URL:?MCP_SERVER_URL must be the public HTTPS origin}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      # No REDDIT_* credentials here on purpose. fetchaller reads Reddit
      # anonymously and has no credential path -- see CLAUDE.md. Wafer owns the
      # session identity, so there is no user agent to pin here either.
      - MOUSER_API_KEY=${MOUSER_API_KEY:-}
      - DIGIKEY_CLIENT_ID=${DIGIKEY_CLIENT_ID:-}
      - DIGIKEY_CLIENT_SECRET=${DIGIKEY_CLIENT_SECRET:-}
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
    volumes:
      - cookie-data:/app/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cookie-data:

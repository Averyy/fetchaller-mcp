# Local development/testing compose file
# Usage: docker compose -f docker-compose.local.yml up --build
#
# Test endpoints:
#   Health:    curl http://localhost:6000/health
#   OAuth:     curl http://localhost:6000/.well-known/oauth-authorization-server
#   Register:  curl -X POST http://localhost:6000/register -H "Content-Type: application/json" -d '{"redirect_uris": ["http://localhost:8080/callback"]}'
#   MCP:       curl -X POST http://localhost:6000/mcp -H "Authorization: Bearer test-api-key-local" -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","method":"tools/list","id":1}'

services:
  fetchaller-mcp:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fetchaller-mcp-local
    # Match production: leave headroom for the 30s ASGI shutdown gate and a
    # still-running, bounded 60s Enterprise browser solve.
    stop_grace_period: 75s
    ports:
      - "6000:6000"
    environment:
      - HTTP_PORT=6000
      - RATE_LIMIT_REQUESTS=100
      - MCP_API_KEY=test-api-key-local
      - MCP_SERVER_URL=http://localhost:6000
      # No REDDIT_* credentials here on purpose. fetchaller reads Reddit
      # anonymously and has no credential path -- see CLAUDE.md. Wafer owns the
      # session identity, so there is no user agent to pin here either.
      - MOUSER_API_KEY=${MOUSER_API_KEY:-}
      - DIGIKEY_CLIENT_ID=${DIGIKEY_CLIENT_ID:-}
      - DIGIKEY_CLIENT_SECRET=${DIGIKEY_CLIENT_SECRET:-}
      - PUID=99
      - PGID=100
      # Fixed dev-only secret so OAuth pairings survive local restarts.
      # NEVER reuse this value in production - generate one with: openssl rand -hex 32
      - JWT_SECRET=local-only-jwt-secret-at-least-32-bytes
      - DATA_DIR=/app/data
      - BROWSER_EXECUTABLE_PATH=/opt/google/chrome/chrome
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-2592000}
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - cookie-data:/app/data
    # No resource limits for local testing (easier debugging)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  cookie-data:

# Local development/testing compose file
# Usage: docker compose -f docker-compose.local.yml up --build
#
# Test endpoints:
#   Health:    curl http://localhost:6000/health
#   OAuth:     curl http://localhost:6000/.well-known/oauth-authorization-server
#   Register:  curl -X POST http://localhost:6000/register -H "Content-Type: application/json" -d '{"redirect_uris": ["http://localhost:8080/callback"]}'
#   MCP:       curl -X POST http://localhost:6000/mcp -H "Authorization: Bearer test-api-key-local" -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","method":"tools/list","id":1}'

services:
  fetchaller-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fetchaller-mcp-local
    ports:
      - "6000:6000"
    environment:
      - HTTP_PORT=6000
      - RATE_LIMIT_REQUESTS=100
      - MCP_API_KEY=test-api-key-local
      - MCP_SERVER_URL=http://localhost:6000
      - CHROME_IDLE_TIMEOUT=60
      # Uncomment to test with separate JWT secret:
      # - JWT_SECRET=test-jwt-secret-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    volumes:
      - cookie-data:/app/data
    # No resource limits for local testing (easier debugging)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  cookie-data:

[project]
name = "fetchaller-mcp"
version = "3.1.0"
description = "MCP server that fetches any URL and returns clean markdown - no domain restrictions. Uses wafer for TLS fingerprint impersonation to bypass bot protection."
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "claude", "fetch", "web", "markdown", "wafer"]
dependencies = [
    "mcp>=1.26.0",
    "wafer-py[browser]>=0.1.9",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "pydantic>=2.12.5",
    "beautifulsoup4>=4.14.3",
    "pymupdf4llm>=0.3.4",
    "pyjwt>=2.11.0",
    "markdownify>=1.2.2",
    "lxml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "ruff>=0.15.5",
]

[project.scripts]
fetchaller-mcp = "fetchaller.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetchaller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# if-necessary-or-explicit: allow prereleases only when explicitly pinned (rnet>=3.0.0rc*)
# or when no stable version exists. "allow" was pulling httpx 1.0.dev which breaks httpx_sse
prerelease = "if-necessary-or-explicit"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

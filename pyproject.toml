[project]
name = "fetchaller-mcp"
version = "3.0.0"
description = "MCP server that fetches any URL and returns clean markdown - no domain restrictions. Uses curl_cffi for TLS fingerprint impersonation to bypass bot protection."
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "claude", "fetch", "web", "markdown", "curl-cffi"]
dependencies = [
    "mcp>=1.2.0",
    "curl-cffi>=0.9",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pyjwt>=2.8",
    "markdownify>=0.14",
    "lxml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.9",
]

[project.scripts]
fetchaller-mcp = "fetchaller.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetchaller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

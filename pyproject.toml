[project]
name = "fetchaller-mcp"
version = "3.5.1"
description = "MCP server that fetches any URL and returns clean markdown - no domain restrictions. Uses wafer for TLS fingerprint impersonation to bypass bot protection."
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "claude", "fetch", "web", "markdown", "wafer"]
dependencies = [
    "mcp>=1.27.1,<2",
    "wafer-py[browser]>=0.4.8",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic>=2.13.4",
    "beautifulsoup4>=4.14.3",
    "pymupdf4llm>=0.3.4",
    "pyjwt>=2.12.1",
    "markdownify>=1.2.2",
    "lxml>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.15.12",
]

[project.scripts]
fetchaller-mcp = "fetchaller.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetchaller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter
